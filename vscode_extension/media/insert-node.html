<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src ${cspSource}; script-src 'nonce-${nonce}';">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="${styleUri}">
<title>Insert Node</title>
</head>
<body>
<div id="mtlx-insert-note" class="mtlx-insert-note" role="note" hidden></div>
<div id="mtlx-insert-toolbar" class="mtlx-insert-toolbar">
    <label for="mtlx-insert-search" class="mtlx-insert-label">Search nodes</label>
    <input id="mtlx-insert-search" class="mtlx-insert-search" type="text" autocomplete="off" placeholder="Search by name or library">
    <label for="mtlx-insert-type" class="mtlx-insert-label">Output type</label>
    <select id="mtlx-insert-type" class="mtlx-insert-select">
        <option value="">Any output type</option>
    </select>
</div>
<div id="mtlx-insert-list" role="list" aria-label="Node categories"></div>
<div id="mtlx-insert-empty" class="mtlx-insert-empty" hidden>No nodes match your search.</div>
<script nonce="${nonce}" src="${scriptUri}"></script>
</body>
</html>
