# -----------------------------------------------------------------------------
# Desktop shell smoke, cross-platform
# -----------------------------------------------------------------------------
# Proving ground for release.yml's `desktop` job "Smoke-test the desktop
# shell" step: runs the same MTLX_SMOKE harness on all three platforms
# outside of a release, so a regression surfaces on a pull request instead
# of during an actual release run.
# -----------------------------------------------------------------------------

name: Desktop smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'electron/**'
      - '.github/workflows/desktop-smoke.yml'

permissions: {}

concurrency:
  group: desktop-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Vendor the offline MaterialX snapshot
        run: npm run vendor:offline

      - name: Install desktop dependencies
        run: npm ci
        working-directory: electron

      - name: Smoke-test the desktop shell
        timeout-minutes: 5
        shell: bash
        run: |
          # ubuntu-24.04 runners restrict unprivileged user namespaces, so
          # Electron falls back to its SUID helper and aborts unless that
          # binary is root-owned with mode 4755 (the message it prints).
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -y && sudo apt-get install -y xvfb
            # The binary is fetched lazily on first launch, so fetch it now
            # (idempotent) before fixing the helper's owner and mode.
            (cd electron && node node_modules/electron/install.js)
            SANDBOX=electron/node_modules/electron/dist/chrome-sandbox
            sudo chown root:root "$SANDBOX" && sudo chmod 4755 "$SANDBOX"
            xvfb-run -a node electron/scripts/dev.mjs --smoke --skip-gallery
          else
            node electron/scripts/dev.mjs --smoke --skip-gallery
          fi
