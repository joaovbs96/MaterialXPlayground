# -----------------------------------------------------------------------------
# Publish GitHub Pages (reusable)
# -----------------------------------------------------------------------------
# The only workflow that stages and deploys the Pages site. Called by:
#
#   - deploy.yml on a published release (site_ref = the release tag).
#   - blog-deploy.yml on a push to main touching blog-src/ (site_ref = the
#     latest release tag, blog_ref = the pushed commit, blog_required).
#
# The app always comes from a release tag and is rebuilt here byte-identical
# to that commit; the blog (blog-src/, Eleventy) comes from blog_ref and is
# built into blog/ on top. A blog-only deploy therefore never ships unreleased
# app code, and a release deploy picks up the current blog from main.
#
# Security shape: `stage` runs all project code (npm ci, build, Eleventy) with
# a read-only token that is not persisted; `deploy` runs no project code and
# is the only job holding pages: write / id-token: write. Actions are pinned
# to full commit SHAs. No workflow-level concurrency: each caller holds the
# `pages` group on the job that calls this workflow.
# -----------------------------------------------------------------------------

name: Publish Pages

on:
  workflow_call:
    inputs:
      site_ref:
        description: Release tag (v<major>.<minor>.<patch>) the app is built from
        type: string
        required: true
      blog_ref:
        description: Ref or commit the blog (blog-src/) is built from
        type: string
        default: main
      reuse_gallery:
        description: Reuse gallery tiles already published on the live site
        type: boolean
        default: true
      blog_required:
        description: Fail instead of skipping when the blog cannot be built
        type: boolean
        default: false
    outputs:
      page_url:
        description: URL of the deployed site
        value: ${{ jobs.deploy.outputs.page_url }}

permissions: {}

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      # The tag shape matters twice: source facts derive asset names from it,
      # and it guards against a branch or SHA being published as a release.
      - name: Validate site ref
        env:
          SITE_REF: ${{ inputs.site_ref }}
        run: |
          echo "$SITE_REF" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::site_ref ($SITE_REF) is not a release tag v<major>.<minor>.<patch>."; exit 1; }

      - name: Checkout site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.site_ref }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Tutorials subsite (mkdocs): inert until tutorials-src/mkdocs.yml exists
      # at site_ref, same gate as deploy.yml's build-verify job.
      - name: Set up Python (tutorials subsite)
        if: hashFiles('tutorials-src/mkdocs.yml') != ''
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tutorials-src/requirements.txt

      - name: Install tutorials dependencies (mkdocs-material)
        if: hashFiles('tutorials-src/mkdocs.yml') != ''
        run: python -m pip install -r tutorials-src/requirements.txt

      - name: Build
        run: npm run build

      - name: Verify committed artifacts match a clean rebuild
        env:
          SITE_REF: ${{ inputs.site_ref }}
        run: |
          git diff --exit-code || { echo "::error::Committed artifacts are stale at $SITE_REF: the tagged commit does not reproduce its own build."; exit 1; }
          [ -z "$(git status --porcelain)" ] || { echo "::error::Build produced files not in the commit."; git status --porcelain; exit 1; }

      # Fetched after the gate: both land in gitignored directories, and the
      # staged site needs them (version switcher, zero-network MaterialX).
      - name: Fetch non-default MaterialX versions
        run: npm run vendor:versions

      - name: Fetch the MaterialX offline snapshot
        run: |
          node --input-type=module -e '
            import { runMaterialx } from "./scripts/vendor.mjs";
            await runMaterialx();
          '

      - name: Stage Pages artifact
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          # electron/ is the desktop app's own source tree, released as its
          # own artifact; blog-src/ is built separately below into blog/.
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='electron' \
            --exclude='node_modules' \
            --exclude='tutorials-src' \
            --exclude='scripts' \
            --exclude='/blog-src' \
            --exclude='/blog' \
            ./ "$RUNNER_TEMP/site"/

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      # Captures run SEQUENTIALLY on purpose (concurrent captures produced
      # blank tiles, see scripts/gallery-shots.mjs). Reusing the live site's
      # tiles renders only materials whose fingerprint changed.
      - name: Generate gallery data
        env:
          REUSE_GALLERY: ${{ inputs.reuse_gallery }}
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          DEST="$RUNNER_TEMP/site/gallery"
          REUSE=()
          if [ "$REUSE_GALLERY" = "true" ]; then REUSE=(--reuse-from "$SITE"); fi
          node scripts/build-gallery.mjs --out "$DEST"
          node scripts/gallery-shots.mjs --manifest "$DEST/manifest.json" --out "$DEST" "${REUSE[@]}"

      # Not committed: the tag isn't knowable ahead of release, and the
      # build-id gate byte-compares committed artifacts. Asset names are
      # derived from the tag since release.yml's own uploads race this job.
      - name: Write source facts
        env:
          RELEASE_TAG: ${{ inputs.site_ref }}
          REPO: ${{ github.repository }}
        run: |
          V="${RELEASE_TAG#v}"
          BASE="https://github.com/${REPO}/releases/download/${RELEASE_TAG}"
          asset() { jq -n --arg name "$1" --arg url "$BASE/$1" '{name: $name, url: $url}'; }
          jq -n \
            --arg version "$RELEASE_TAG" \
            --argjson vsix "$(asset "materialx-playground-vscode-${RELEASE_TAG}.vsix")" \
            --argjson winSetup "$(asset "MaterialX.Playground.Setup.${V}.exe")" \
            --argjson winPortable "$(asset "MaterialX.Playground.${V}.exe")" \
            --argjson macDmg "$(asset "MaterialX.Playground-${V}-arm64.dmg")" \
            --argjson macZip "$(asset "MaterialX.Playground-${V}-arm64-mac.zip")" \
            --argjson linuxAppImage "$(asset "MaterialX.Playground-${V}.AppImage")" \
            --argjson linuxDeb "$(asset "materialx-playground-desktop_${V}_amd64.deb")" \
            '{version: $version, vsix: $vsix, desktop: {winSetup: $winSetup, winPortable: $winPortable, macDmg: $macDmg, macZip: $macZip, linuxAppImage: $linuxAppImage, linuxDeb: $linuxDeb}}' \
            > "$RUNNER_TEMP/site/source-facts.json"
          cat "$RUNNER_TEMP/site/source-facts.json"

      # Checked out only now, so it can never reach the byte-identical gate
      # or the rsync above. Sparse: nothing but blog-src/ from blog_ref.
      - name: Checkout blog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.blog_ref }}
          path: blog-checkout
          sparse-checkout: blog-src
          persist-credentials: false

      # The blog needs a header that knows subsites (window.__MTLX_SUBSITE__);
      # an older app tag would render it with broken links, so skip or fail.
      - name: Build blog
        env:
          BLOG_REQUIRED: ${{ inputs.blog_required }}
          SITE_REF: ${{ inputs.site_ref }}
          BLOG_REF: ${{ inputs.blog_ref }}
          PATH_PREFIX: /${{ github.event.repository.name }}/blog/
        run: |
          skip() {
            if [ "$BLOG_REQUIRED" = "true" ]; then echo "::error::$1"; exit 1; fi
            echo "::warning::$1 Publishing without the blog."
            exit 0
          }
          [ -f blog-checkout/blog-src/package.json ] || skip "blog-src/ not found at $BLOG_REF."
          grep -q __MTLX_SUBSITE__ "$RUNNER_TEMP/site/js/site-header.js" || skip "The site header at $SITE_REF has no subsite support."
          cd blog-checkout/blog-src
          npm ci --ignore-scripts
          ELEVENTY_RUN_MODE=build npm run build -- --output "$RUNNER_TEMP/blog-out" --pathprefix "$PATH_PREFIX"
          test -f "$RUNNER_TEMP/blog-out/index.html" || { echo "::error::Eleventy produced no blog/index.html."; exit 1; }
          mkdir -p "$RUNNER_TEMP/site/blog"
          rsync -a --delete "$RUNNER_TEMP/blog-out"/ "$RUNNER_TEMP/site/blog"/
          echo "blog pages: $(find "$RUNNER_TEMP/site/blog" -name index.html | wc -l)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: stage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
