# -----------------------------------------------------------------------------
# Build, verify & deploy
# -----------------------------------------------------------------------------
# This is the single gate between a published release's tagged commit and
# what's live on GitHub Pages. It guarantees:
#
#   - A broken or stale build never deploys. `npm run build` must reproduce
#     the committed tree byte-for-byte (checked via `git diff` / `git status`
#     against the freshly rebuilt tree), and `npm run check` (every
#     deterministic drift check) must pass. The `publish` job needs
#     `build-verify`, so nothing is staged until both gates pass.
#   - Pushes to `main`, pull requests, and manual dispatch only get
#     verification. On a published release, `publish` calls
#     pages-publish.yml, which rebuilds the tag, stages it (app, gallery,
#     source facts, plus the blog from main) and deploys it.
#   - blog-deploy.yml calls the same workflow for blog-only changes. Both
#     callers hold the `pages` concurrency group on the calling job, so a
#     verify run never queues behind or replaces a deploy.
#   - release.yml waits on this workflow's release run; the called
#     workflow's jobs run inside that run, so the wait still covers the
#     deploy.
#
# Tutorials subsite (mkdocs): the Python/mkdocs setup steps below are gated
# on `tutorials-src/mkdocs.yml` existing. That file lives on another branch
# today, so those steps are inert (skipped) on `main` right now. The moment
# that branch merges and the file appears, the steps auto-activate (here and
# in pages-publish.yml) with no edits needed.
# -----------------------------------------------------------------------------

name: Build, verify & deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Dispatch only: a dry run of the fetch pages-publish.yml does at
      # release time, so that path can be smoke-tested WITHOUT cutting a
      # release. Otherwise its first real execution would be a live
      # release, and a failure there fails the deploy with it.
      #
      # Skipped on push/PR/release. Nothing here consumes the fetched
      # versions: `npm run build` skips them entirely and `npm run check`
      # treats an absent version directory as valid, so fetching buys
      # nothing while putting an external download on the critical path for
      # unrelated work. scripts/fetch-mtlx-versions.mjs has no retry (one
      # `fetch`, and a non-2xx calls fail() -> exit 1), so a single
      # transient 503 from the release-asset CDN would fail an unrelated PR.
      #
      # Deliberately NOT continue-on-error: that turns a hard failure into
      # a warning nobody reads.
      #
      # The fetched files land in js/materialx/<version>/ and are
      # gitignored, so they can't trip the staleness gates below either.
      # On dispatch they also make `npm run check` verify each version's
      # bytes, which turns a dispatch run into a real upstream-drift check.
      - name: Fetch non-default MaterialX versions
        if: github.event_name == 'workflow_dispatch'
        run: npm run vendor:versions

      - name: Set up Python (tutorials subsite)
        if: hashFiles('tutorials-src/mkdocs.yml') != ''
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tutorials-src/requirements.txt

      - name: Install tutorials dependencies (mkdocs-material)
        if: hashFiles('tutorials-src/mkdocs.yml') != ''
        run: python -m pip install -r tutorials-src/requirements.txt

      - name: Build
        run: npm run build

      - name: Verify committed artifacts match a clean rebuild
        run: |
          git diff --exit-code || { echo "::error::Committed artifacts are stale: run 'npm run build' locally and commit the result."; exit 1; }
          [ -z "$(git status --porcelain)" ] || { echo "::error::Build produced files not in the commit: run 'npm run build' and commit."; git status --porcelain; exit 1; }

      - name: Check
        run: npm run check

      - name: Unit tests
        run: npm run test:unit

      # Dispatch only: a dry run of the snapshot fetch pages-publish.yml does
      # before staging (the deployed site serves MaterialX resources locally).
      - name: Fetch the MaterialX offline snapshot
        if: github.event_name == 'workflow_dispatch'
        run: |
          node --input-type=module -e '
            import { runMaterialx } from "./scripts/vendor.mjs";
            await runMaterialx();
          '

      - name: Install Playwright chromium
        if: github.event_name == 'workflow_dispatch'
        run: npx playwright install --with-deps chromium

      # Gallery dry run: real rendering into a scratch directory, nothing
      # reused or published. A dispatch deliberately does NOT reuse the live
      # tiles: it is only worth anything if it exercises real rendering. The
      # release path (reuse, generate into the staged site) is in
      # pages-publish.yml.
      #
      # Captures run SEQUENTIALLY on purpose. Concurrency measured 1.33x
      # faster but silently produced 8 blank thumbnails out of 54 (the
      # screenshot races the first paint); see scripts/gallery-shots.mjs.
      # A blank tile that exits 0 is worse than a slow job.
      - name: Generate gallery data (dry run)
        if: github.event_name == 'workflow_dispatch'
        run: |
          DEST="$RUNNER_TEMP/gallery-dryrun"
          node scripts/build-gallery.mjs --out "$DEST"
          node scripts/gallery-shots.mjs --manifest "$DEST/manifest.json" --out "$DEST"

  # Release only: stage and deploy the tag through the shared Pages workflow.
  # The pages group lives on this job, not at workflow level, so push and PR
  # verify runs can never cancel or queue a deploy.
  publish:
    needs: build-verify
    if: github.event_name == 'release'
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    uses: ./.github/workflows/pages-publish.yml
    with:
      site_ref: ${{ github.event.release.tag_name }}
      blog_ref: main
