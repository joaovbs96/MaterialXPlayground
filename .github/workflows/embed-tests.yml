# Runs the Playwright suite for the embeddable MaterialX viewer
# (tests/embed/**) on headless Chromium, on every push and PR.
# Rebuilds embed/gen/*.js from source first, so tests exercise current code.

name: Embed tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Regenerate embed bundles
        run: node scripts/build.mjs embed

      - name: Run embed tests
        run: npm run test:embed
