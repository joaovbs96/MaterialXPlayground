# -----------------------------------------------------------------------------
# Release offline package
# -----------------------------------------------------------------------------
# Builds a fully-offline package of the site (the servable tree plus the
# vendor/materialx/ snapshot, so the app performs zero network access) and
# attaches it to the GitHub release that triggered the run — alongside an
# offline .vsix of the VS Code extension as a second release asset.
#
# Security shape (mirrors deploy.yml's build/deploy split):
#   - The `package` job runs all project code (npm ci, build, checks) with a
#     read-only token that is not persisted into .git/config. The MaterialX
#     snapshot is fetched over anonymous git (no token, no API rate limit).
#   - The `upload` job is the only place `contents: write` exists. It runs
#     zero project code — no checkout, just artifact download + `gh release
#     upload` — so the write token never shares a job with npm dependencies.
#   - Actions are pinned to full commit SHAs (kept fresh by Dependabot).
#
# Failure modes worth knowing:
#   - The extension version users see after install is DERIVED from the
#     release tag (package.json's "version" is overwritten in the runner
#     before packaging — the committed value only matters for manual
#     workflow_dispatch builds). Tags must therefore look like
#     v<major>.<minor>.<patch>; a malformed tag fails fast before any
#     expensive work — delete the tag, re-tag correctly, re-publish.
#   - The stale-artifact gate re-runs deploy.yml's guarantee against the
#     tagged commit. If a release is cut from a commit that fails it, this
#     job fails BEFORE packaging — fix the commit, re-tag, re-publish.
#   - `workflow_dispatch` runs the full pipeline but skips the upload job
#     (there is no release to attach to); grab the workflow artifact instead.
#
# Note: the site header's runtime fetch of GitHub release info (a soft-failing
# badge) is intentionally outside the offline guarantee.
# -----------------------------------------------------------------------------

name: Release offline package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-package-${{ github.event.release.tag_name || github.run_id }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      name: ${{ steps.pkg.outputs.name }}
      vsix_name: ${{ steps.pkg.outputs.vsix_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # The extension version is derived from the release tag (see the
      # "Set extension version from release tag" step below), and vsce
      # refuses non-semver versions — so validate the tag shape here,
      # before any expensive work.
      - name: Validate release tag shape
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          echo "${TAG#v}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::release tag ($TAG) is not v<major>.<minor>.<patch> — the extension version is derived from the tag, so it must be \"v\" + a plain semver triplet. Delete the tag, re-tag, re-publish."; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Vendor the offline MaterialX snapshot
        run: npm run vendor:offline

      - name: Build
        run: npm run build

      - name: Verify committed artifacts match a clean rebuild
        run: |
          git diff --exit-code || { echo "::error::Committed artifacts are stale — the tagged commit does not reproduce its own build. Fix, re-tag, re-publish."; exit 1; }
          [ -z "$(git status --porcelain)" ] || { echo "::error::Build produced files not in the commit."; git status --porcelain; exit 1; }

      - name: Check
        run: npm run check

      # The version users see after install comes from package.json's
      # "version" — derive it from the release tag so cutting a release
      # never requires a version-bump commit. This intentionally dirties
      # the tree AFTER the stale-artifact gate certified it and `npm run
      # check` ran against the pristine tree; the staged site and the
      # .vsix both pick up the derived version. Manual workflow_dispatch
      # runs keep the committed version as-is.
      - name: Set extension version from release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: npm pkg set version="${TAG#v}"

      - name: Determine package name
        id: pkg
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then TAG="manual-$(git rev-parse --short HEAD)"; fi
          echo "name=materialx-playground-$TAG-offline" >> "$GITHUB_OUTPUT"
          echo "vsix_name=materialx-playground-vscode-$TAG" >> "$GITHUB_OUTPUT"

      - name: Stage offline site
        run: |
          DEST="$RUNNER_TEMP/package/${{ steps.pkg.outputs.name }}"
          mkdir -p "$DEST"
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='.claude' \
            --exclude='.vscode' \
            --exclude='.vscodeignore' \
            --exclude='node_modules' \
            --exclude='tutorials-src' \
            --exclude='scripts' \
            ./ "$DEST"/

      - name: Sanity-check staged tree
        run: |
          DEST="$RUNNER_TEMP/package/${{ steps.pkg.outputs.name }}"
          test -f "$DEST/index.html" || { echo "::error::index.html missing from staged tree"; exit 1; }
          test -f "$DEST/vendor/materialx/manifest.json" || { echo "::error::vendor/materialx/manifest.json missing — the package would NOT be offline"; exit 1; }
          node -e '
            const m = require(process.argv[1]);
            console.log(`MaterialX snapshot: tag=${m.tag} files=${m.fileCount} bytes=${m.totalBytes}`);
          ' "$DEST/vendor/materialx/manifest.json" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Create zip
        run: |
          cd "$RUNNER_TEMP/package"
          zip -r -q "$RUNNER_TEMP/${{ steps.pkg.outputs.name }}.zip" "${{ steps.pkg.outputs.name }}"
          unzip -l "$RUNNER_TEMP/${{ steps.pkg.outputs.name }}.zip" | grep -q 'vendor/materialx/manifest.json' \
            || { echo "::error::manifest.json missing from zip"; exit 1; }
          ls -lh "$RUNNER_TEMP/${{ steps.pkg.outputs.name }}.zip" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: ${{ runner.temp }}/${{ steps.pkg.outputs.name }}.zip
          if-no-files-found: error

      # vsce writes into cwd by default, which would dirty the tree the
      # stale-artifact gate just certified — always --out into RUNNER_TEMP.
      # vendor/materialx/ is present (vendored above) and NOT in
      # .vscodeignore, so this is the OFFLINE flavor (zero runtime network).
      # Lean variant, if ever wanted: `rm -rf vendor/materialx` first and
      # drop the manifest.json assertion below.
      # NOTE: never add a "vscode:prepublish" script to package.json — vsce
      # would execute it here, inside the certified tree.
      - name: Package VS Code extension (.vsix)
        run: |
          npx --yes @vscode/vsce@3.9.2 package --no-dependencies \
            --out "$RUNNER_TEMP/${{ steps.pkg.outputs.vsix_name }}.vsix"

      - name: Sanity-check vsix contents
        run: |
          VSIX="$RUNNER_TEMP/${{ steps.pkg.outputs.vsix_name }}.vsix"
          L="$(unzip -l "$VSIX")"
          echo "$L" | grep -q 'extension/vendor/materialx/manifest.json' || { echo "::error::vendor/materialx missing — vsix would not be offline"; exit 1; }
          echo "$L" | grep -q 'extension/js/gen/mtlx-version.json' || { echo "::error::js/gen missing (specDocs.js requires it)"; exit 1; }
          echo "$L" | grep -q 'extension/environment_map.mtlx' || { echo "::error::environment_map.mtlx missing (light-rig fetch)"; exit 1; }
          echo "$L" | grep -q 'extension/vscode_extension/src/extension.js' || { echo "::error::extension sources missing"; exit 1; }
          if echo "$L" | grep -qE 'extension/(node_modules|scripts|\.github)/'; then echo "::error::ignored dirs leaked into the vsix"; exit 1; fi
          ls -lh "$VSIX" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload vsix artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.pkg.outputs.vsix_name }}
          path: ${{ runner.temp }}/${{ steps.pkg.outputs.vsix_name }}.vsix
          if-no-files-found: error

  upload:
    needs: package
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.package.outputs.name }}

      - name: Download vsix artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.package.outputs.vsix_name }}

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ needs.package.outputs.name }}.zip" --clobber

      - name: Attach vsix to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ needs.package.outputs.vsix_name }}.vsix" --clobber
