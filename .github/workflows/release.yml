# -----------------------------------------------------------------------------
# Release offline package
# -----------------------------------------------------------------------------
# Builds a fully-offline package of the site (the servable tree plus the
# vendor/materialx/ snapshot, so the app performs zero network access) and
# attaches it to the GitHub release that triggered the run — alongside an
# offline .vsix of the VS Code extension as a second release asset.
#
# Security shape (mirrors deploy.yml's build/deploy split):
#   - The `package` job runs all project code (npm ci, build, checks) with a
#     read-only token that is not persisted into .git/config. The MaterialX
#     snapshot is fetched over anonymous git (no token, no API rate limit).
#   - The `upload` job is the only place `contents: write` exists. It runs
#     zero project code — no checkout, just artifact download + `gh release
#     upload` — so the write token never shares a job with npm dependencies.
#   - Actions are pinned to full commit SHAs (kept fresh by Dependabot).
#
# Failure modes worth knowing:
#   - The extension version users see after install is DERIVED from the
#     release tag (package.json's "version" is overwritten in the runner
#     before packaging — the committed value only matters for manual
#     workflow_dispatch builds). Tags must therefore look like
#     v<major>.<minor>.<patch>; a malformed tag fails fast before any
#     expensive work — delete the tag, re-tag correctly, re-publish.
#   - The stale-artifact gate re-runs deploy.yml's guarantee against the
#     tagged commit. If a release is cut from a commit that fails it, this
#     job fails BEFORE packaging — fix the commit, re-tag, re-publish.
#   - `workflow_dispatch` runs the full pipeline but skips the upload job
#     (there is no release to attach to); grab the workflow artifact instead.
#
# Note: the site header's runtime fetch of GitHub release info (a soft-failing
# badge) is intentionally outside the offline guarantee.
# -----------------------------------------------------------------------------

name: Release offline package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-package-${{ github.event.release.tag_name || github.run_id }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      name: ${{ steps.pkg.outputs.name }}
      vsix_name: ${{ steps.pkg.outputs.vsix_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # The extension version is derived from the release tag (see the
      # "Set extension version from release tag" step below), and vsce
      # refuses non-semver versions — so validate the tag shape here,
      # before any expensive work.
      - name: Validate release tag shape
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          echo "${TAG#v}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::release tag ($TAG) is not v<major>.<minor>.<patch> — the extension version is derived from the tag, so it must be \"v\" + a plain semver triplet. Delete the tag, re-tag, re-publish."; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Vendor the offline MaterialX snapshot
        run: npm run vendor:offline

      # Every version this repo supports (scripts/lib/mtlx-versions.mjs)
      # must be on disk before staging below — the offline zip is the
      # only place non-default versions are distributed at all, since
      # the .vsix intentionally ships the default only (see the vsix
      # sanity check further down).
      - name: Fetch non-default MaterialX versions
        run: npm run vendor:versions

      - name: Build
        run: npm run build

      - name: Verify committed artifacts match a clean rebuild
        run: |
          git diff --exit-code || { echo "::error::Committed artifacts are stale — the tagged commit does not reproduce its own build. Fix, re-tag, re-publish."; exit 1; }
          [ -z "$(git status --porcelain)" ] || { echo "::error::Build produced files not in the commit."; git status --porcelain; exit 1; }

      - name: Check
        run: npm run check

      # The version users see after install comes from package.json's
      # "version" — derive it from the release tag so cutting a release
      # never requires a version-bump commit. This intentionally dirties
      # the tree AFTER the stale-artifact gate certified it and `npm run
      # check` ran against the pristine tree; the staged site and the
      # .vsix both pick up the derived version. Manual workflow_dispatch
      # runs keep the committed version as-is.
      - name: Set extension version from release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: npm pkg set version="${TAG#v}"

      - name: Determine package name
        id: pkg
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then TAG="manual-$(git rev-parse --short HEAD)"; fi
          echo "name=materialx-playground-$TAG-offline" >> "$GITHUB_OUTPUT"
          echo "vsix_name=materialx-playground-vscode-$TAG" >> "$GITHUB_OUTPUT"

          # scripts/lib/mtlx-versions.mjs is the single source of truth for
          # which MaterialX versions this repo supports — read it here
          # instead of hardcoding version numbers in this workflow, so the
          # offline-zip and vsix assertions further down stay correct as
          # versions are added or retired.
          MTLX_VERSIONS="$(node --input-type=module -e '
            import { MTLX_VERSIONS } from "./scripts/lib/mtlx-versions.mjs";
            console.log(MTLX_VERSIONS.map((v) => v.version).join(" "));
          ')"
          MTLX_DEFAULT_VERSION="$(node --input-type=module -e '
            import { DEFAULT_MTLX_VERSION } from "./scripts/lib/mtlx-versions.mjs";
            console.log(DEFAULT_MTLX_VERSION);
          ')"
          echo "mtlx_versions=$MTLX_VERSIONS" >> "$GITHUB_OUTPUT"
          echo "mtlx_default_version=$MTLX_DEFAULT_VERSION" >> "$GITHUB_OUTPUT"

      # Populates gallery/ at the repo root BEFORE the rsync below, so the
      # offline zip carries it and electron/scripts/stage-site.mjs (desktop
      # job) finds it too. --reuse-only downloads the tiles the live site
      # already published and renders NOTHING: rendering needs a browser and
      # costs ~13s a material on a GPU-less runner. Materials published since
      # the last deploy simply keep the gallery placeholder.
      - name: Populate gallery data
        run: |
          node scripts/build-gallery.mjs
          node scripts/gallery-shots.mjs --reuse-from "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" --reuse-only

      - name: Stage offline site
        run: |
          DEST="$RUNNER_TEMP/package/${{ steps.pkg.outputs.name }}"
          mkdir -p "$DEST"
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            --exclude='.claude' \
            --exclude='.vscode' \
            --exclude='.vscodeignore' \
            --exclude='electron' \
            --exclude='node_modules' \
            --exclude='tutorials-src' \
            --exclude='scripts' \
            ./ "$DEST"/

      - name: Sanity-check staged tree
        run: |
          DEST="$RUNNER_TEMP/package/${{ steps.pkg.outputs.name }}"
          test -f "$DEST/index.html" || { echo "::error::index.html missing from staged tree"; exit 1; }
          test -f "$DEST/vendor/materialx/manifest.json" || { echo "::error::vendor/materialx/manifest.json missing — the package would NOT be offline"; exit 1; }
          node -e '
            const m = require(process.argv[1]);
            console.log(`MaterialX snapshot: tag=${m.tag} files=${m.fileCount} bytes=${m.totalBytes}`);
          ' "$DEST/vendor/materialx/manifest.json" | tee -a "$GITHUB_STEP_SUMMARY"

          # Every supported MaterialX version (scripts/lib/mtlx-versions.mjs,
          # surfaced above as steps.pkg.outputs.mtlx_versions) must be
          # present in the staged tree — the offline zip is the only place
          # non-default versions are distributed, so a silent miss here
          # would mean the package would NOT be offline for those versions.
          VERSION_COUNT=0
          VERSION_BYTES=0
          for V in ${{ steps.pkg.outputs.mtlx_versions }}; do
            for F in JsMaterialXGenShader.js JsMaterialXGenShader.wasm JsMaterialXGenShader.data; do
              P="$DEST/js/materialx/$V/$F"
              test -f "$P" || { echo "::error::js/materialx/$V/$F missing from staged tree — the offline package would not contain MaterialX $V"; exit 1; }
              VERSION_BYTES=$((VERSION_BYTES + $(stat -c%s "$P")))
            done
            VERSION_COUNT=$((VERSION_COUNT + 1))
          done
          echo "MaterialX versions bundled: ${{ steps.pkg.outputs.mtlx_versions }} (versions=$VERSION_COUNT bytes=$VERSION_BYTES)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Create zip
        run: |
          cd "$RUNNER_TEMP/package"
          zip -r -q "$RUNNER_TEMP/${{ steps.pkg.outputs.name }}.zip" "${{ steps.pkg.outputs.name }}"
          Z="$(unzip -l "$RUNNER_TEMP/${{ steps.pkg.outputs.name }}.zip")"
          echo "$Z" | grep -q 'vendor/materialx/manifest.json' \
            || { echo "::error::manifest.json missing from zip"; exit 1; }
          # embed/ (the self-hostable <materialx-viewer> web embed) must ship
          # in the offline zip — it's the only place self-hosting docs point
          # people at (see docs/EMBEDDING.md's "Self-hosting" section).
          echo "$Z" | grep -q 'embed/viewer.html' \
            || { echo "::error::embed/viewer.html missing from zip — the offline package would not support self-hosted embeds"; exit 1; }
          echo "$Z" | grep -q 'embed/mtlx-viewer.js' \
            || { echo "::error::embed/mtlx-viewer.js missing from zip — the offline package would not support self-hosted embeds"; exit 1; }
          # Re-verify every supported MaterialX version made it into the
          # actual zip entries (not just the pre-zip staged tree above).
          for V in ${{ steps.pkg.outputs.mtlx_versions }}; do
            echo "$Z" | grep -q "js/materialx/$V/JsMaterialXGenShader.wasm" \
              || { echo "::error::js/materialx/$V/JsMaterialXGenShader.wasm missing from zip"; exit 1; }
          done
          ls -lh "$RUNNER_TEMP/${{ steps.pkg.outputs.name }}.zip" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: ${{ runner.temp }}/${{ steps.pkg.outputs.name }}.zip
          if-no-files-found: error

      # vsce writes into cwd by default, which would dirty the tree the
      # stale-artifact gate just certified — always --out into RUNNER_TEMP.
      # vendor/materialx/ is present (vendored above) and NOT in
      # .vscodeignore, so this is the OFFLINE flavor (zero runtime network).
      # Lean variant, if ever wanted: `rm -rf vendor/materialx` first and
      # drop the manifest.json assertion below.
      # NOTE: never add a "vscode:prepublish" script to package.json — vsce
      # would execute it here, inside the certified tree.
      - name: Package VS Code extension (.vsix)
        run: |
          npx --yes @vscode/vsce@3.9.2 package --no-dependencies \
            --out "$RUNNER_TEMP/${{ steps.pkg.outputs.vsix_name }}.vsix"

      - name: Sanity-check vsix contents
        run: |
          VSIX="$RUNNER_TEMP/${{ steps.pkg.outputs.vsix_name }}.vsix"
          L="$(unzip -l "$VSIX")"
          echo "$L" | grep -q 'extension/vendor/materialx/manifest.json' || { echo "::error::vendor/materialx missing — vsix would not be offline"; exit 1; }
          echo "$L" | grep -q 'extension/js/gen/mtlx-version.json' || { echo "::error::js/gen missing (specDocs.js requires it)"; exit 1; }
          echo "$L" | grep -q 'extension/environment_map.mtlx' || { echo "::error::environment_map.mtlx missing (light-rig fetch)"; exit 1; }
          echo "$L" | grep -q 'extension/vscode_extension/src/extension.js' || { echo "::error::extension sources missing"; exit 1; }
          if echo "$L" | grep -qE 'extension/(node_modules|scripts|\.github|embed)/'; then echo "::error::ignored dirs leaked into the vsix"; exit 1; fi

          # Positive: the default version's WASM path just moved under
          # js/materialx/<version>/ — a silent miss here would ship a
          # structurally valid but completely broken extension (no
          # MaterialX engine at all).
          DEFAULT_DIR="extension/js/materialx/${{ steps.pkg.outputs.mtlx_default_version }}"
          for F in JsMaterialXGenShader.js JsMaterialXGenShader.wasm JsMaterialXGenShader.data; do
            echo "$L" | grep -q "$DEFAULT_DIR/$F" || { echo "::error::$DEFAULT_DIR/$F missing — vsix would not load MaterialX"; exit 1; }
          done

          # Negative: only the default version should ship — .vscodeignore
          # excludes the rest (Compare, the only feature that needs extra
          # versions, isn't in the webview nav; see js/site-header.js:157-159).
          for V in ${{ steps.pkg.outputs.mtlx_versions }}; do
            if [ "$V" != "${{ steps.pkg.outputs.mtlx_default_version }}" ]; then
              if echo "$L" | grep -q "extension/js/materialx/$V/"; then echo "::error::non-default MaterialX version $V leaked into the vsix"; exit 1; fi
            fi
          done

          ls -lh "$VSIX" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload vsix artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.pkg.outputs.vsix_name }}
          path: ${{ runner.temp }}/${{ steps.pkg.outputs.vsix_name }}.vsix
          if-no-files-found: error

  # Phase 6, final step: build the desktop installers. Mandatory matrix,
  # not a convenience: electron-builder cross-compiles poorly, so mac
  # artifacts need the macos runner and linux artifacts the ubuntu one.
  # `needs: package` certifies the tree once (build, stale gate, check)
  # before three runners spend 40+ minutes each on it.
  desktop:
    needs: package
    if: github.event_name == 'release'
    strategy:
      # One platform failing must not deny the other two their artifacts.
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # resolve-version.mjs prefers the release tag from the environment,
          # but falls back to `git describe`, which returns nothing on a
          # shallow clone and would silently drop to package.json's stale
          # number. Full history keeps that fallback honest.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Vendor the offline MaterialX snapshot
        run: npm run vendor:offline

      # Same reuse-only download as the package job: the desktop app ships
      # the gallery, but no runner should re-render tiles the site already
      # published. Without this the packaged app shows the gallery's "not
      # generated" card and its preset picker falls back to MTLX_PRESETS.
      - name: Populate gallery data
        run: |
          node scripts/build-gallery.mjs
          node scripts/gallery-shots.mjs --reuse-from "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" --reuse-only

      - name: Install desktop dependencies
        run: npm ci
        working-directory: electron

      - name: Smoke-test the desktop shell
        timeout-minutes: 5
        shell: bash
        run: |
          # Fallback if the Linux leg fails on sandbox errors: prefix the
          # xvfb-run command with ELECTRON_DISABLE_SANDBOX=1. Not applied by
          # default; only add it if this step starts failing on ubuntu-latest.
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -y && sudo apt-get install -y xvfb
            xvfb-run -a node electron/scripts/dev.mjs --smoke
          else
            node electron/scripts/dev.mjs --smoke
          fi

      # pack.mjs stages the site, resolves the version from the tag and runs
      # electron-builder --publish never; it writes nothing tracked, so the
      # stale gate in `package` stays valid.
      - name: Build desktop app
        run: node scripts/pack.mjs --skip-gallery
        working-directory: electron

      - name: Sanity-check desktop output
        shell: bash
        run: |
          test -f electron/dist-site/gallery/manifest.json || { echo "::error::gallery data missing from the staged desktop site"; exit 1; }
          THUMBS=$(ls electron/dist-site/gallery/thumbs 2>/dev/null | wc -l)
          echo "staged gallery thumbnails: $THUMBS"
          COUNT=$(find electron/dist -maxdepth 1 -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.deb" \) | wc -l)
          test "$COUNT" -gt 0 || { echo "::error::electron-builder produced no installer on ${{ matrix.os }}"; exit 1; }
          find electron/dist -maxdepth 1 -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.deb" \) -exec ls -lh {} \;

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.os }}
          path: |
            electron/dist/*.exe
            electron/dist/*.dmg
            electron/dist/*.zip
            electron/dist/*.AppImage
            electron/dist/*.deb
          if-no-files-found: error

  upload:
    needs: [package, desktop]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.package.outputs.name }}

      - name: Download vsix artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.package.outputs.vsix_name }}

      # All three platforms land in one directory; each matrix artifact is
      # named separately so a platform that failed simply contributes none.
      - name: Download desktop artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*
          merge-multiple: true
          path: desktop

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ needs.package.outputs.name }}.zip" --clobber

      - name: Attach desktop installers to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          FILES=(desktop/*)
          test ${#FILES[@]} -gt 0 || { echo "::error::no desktop installers to attach"; exit 1; }
          gh release upload "${{ github.event.release.tag_name }}" "${FILES[@]}" --clobber

      - name: Attach vsix to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ needs.package.outputs.vsix_name }}.vsix" --clobber
